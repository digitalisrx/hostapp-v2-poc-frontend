<header class="flex h-12 w-full shrink-0 items-center border-b border-gray-200 bg-white pl-3 pr-2">
  <span class="header-text">{{ title() }}</span>

  <div class="ml-auto flex items-center gap-2">
    <button
      type="button"
      class="flex size-8 items-center justify-center rounded p-1 text-gray-500 hover:bg-gray-100 hover:text-gray-900 focus-visible:outline focus-visible:outline-2 focus-visible:outline-blue-600"
      aria-label="Debug"
      (click)="debugModalOpen.set(true)"
    >
      <svg lucideBug [size]="18"></svg>
    </button>
    <button
      type="button"
      class="flex size-8 items-center justify-center rounded p-1 text-gray-500 hover:bg-gray-100 hover:text-gray-900 focus-visible:outline focus-visible:outline-2 focus-visible:outline-blue-600"
      aria-label="Instellingen"
      (click)="settingsModalOpen.set(true)"
    >
      <svg lucideSettings [size]="18"></svg>
    </button>
    @if (authStore.user(); as user) {
      <span class="hidden max-w-32 truncate text-sm text-gray-600 sm:block">{{ user.email }}</span>
      <button
        type="button"
        class="flex size-8 items-center justify-center rounded p-1 text-gray-500 hover:bg-gray-100 hover:text-gray-900 focus-visible:outline focus-visible:outline-2 focus-visible:outline-blue-600"
        aria-label="Uitloggen"
        (click)="authStore.logout()"
      >
        <svg lucideLogOut [size]="18"></svg>
      </button>
    } @else {
      <button
        type="button"
        class="flex size-8 items-center justify-center rounded p-1 text-gray-500 hover:bg-gray-100 hover:text-gray-900 focus-visible:outline focus-visible:outline-2 focus-visible:outline-blue-600"
        aria-label="Inloggen"
        (click)="loginModalOpen.set(true)"
      >
        <svg lucideUser [size]="18"></svg>
      </button>
    }
  </div>
</header>

<main class="flex min-h-0 w-full flex-1 overflow-hidden">
  <app-patient-sidebar
    [activeSessionType]="activeSessionType()"
    (runSession)="runSession($event.type, $event.icpc, $event.prescription, $event.editingMedicationId)"
  />
  <app-prescriptor-view [iframeUrl]="iframeUrl()" [errorMessage]="errorMessage()" />
</main>

<app-debug-modal [open]="debugModalOpen()" (close)="debugModalOpen.set(false)" />
<app-settings-modal [open]="settingsModalOpen()" (close)="settingsModalOpen.set(false)" />
<app-login-modal [open]="loginModalOpen()" (close)="loginModalOpen.set(false)" />

<router-outlet />
